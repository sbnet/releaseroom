name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    name: Flux gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate

      # Build before the gates: Inertia feature tests render the app layout,
      # which requires the Vite manifest to exist.
      - name: Build
        run: npm run build

      - name: Run flux gates (on_push)
        run: bash .claude/hooks/flux-gate.sh ci
