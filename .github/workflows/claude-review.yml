name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated reviewer of this flux-managed repository.
            Style, static analysis, types and tests are already enforced by
            the "Flux gates" CI job; do not re-check them. Focus on what
            machines miss:
            - logic errors and edge cases
            - architecture and design fit with the existing codebase
            - security implications
            - spec conformance: if the PR references a spec (specs/SPEC-*.md),
              verify the acceptance criteria are covered
            - test coverage gaps (missing cases, not missing runs)

            The PR branch is already checked out in the working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments; don't submit review text as messages.
            You review, you never approve: merging requires a human decision.

          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
